<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>HyperThermal</title>
<style>
:root {
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --text: #000000;
  --text-secondary: #888888;
  --text-tertiary: #B0B0B0;
  --divider: #F0F0F0;
  --primary: #3482FF;
  --primary-light: rgba(52,130,255,.1);
  --switch-on: #3482FF;
  --switch-off: #E0E0E0;
  --input-bg: #F5F5F5;
  --tag-bg: #F0F0F0;
  --danger: #FA5151;
  --success: #07C160;
  --warn: #FFA940;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1A1A1A;
    --text: #FFFFFF;
    --text-secondary: #999999;
    --text-tertiary: #666666;
    --divider: #2A2A2A;
    --primary: #4A9EFF;
    --primary-light: rgba(74,158,255,.12);
    --switch-off: #3A3A3A;
    --input-bg: #252525;
    --tag-bg: #2A2A2A;
  }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: "MiSans", -apple-system, "SF Pro Display", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

/* ── TopAppBar ── */
.topbar {
  padding: 56px 24px 16px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.topbar .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* ── Status Row ── */
.status-row {
  display: flex;
  gap: 10px;
  padding: 0 16px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.status-row::-webkit-scrollbar { display: none; }
.status-item {
  flex: 1;
  min-width: 80px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}
.status-item .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
.status-item .lbl { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

/* ── SmallTitle ── */
.small-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  padding: 20px 32px 8px;
}

/* ── Card ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  margin: 0 16px 10px;
  overflow: hidden;
}

/* ── Preference Item (BasicComponent) ── */
.pref {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  gap: 14px;
  min-height: 56px;
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.pref:active { background: var(--primary-light); }
.pref + .pref { border-top: .5px solid var(--divider); }
.pref-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.pref-body { flex: 1; min-width: 0; }
.pref-title { font-size: 15px; font-weight: 400; }
.pref-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pref-right { flex-shrink: 0; display: flex; align-items: center; }

/* ── HyperOS Switch ── */
.hyper-switch {
  position: relative;
  width: 50px; height: 28px;
  cursor: pointer;
}
.hyper-switch input { display: none; }
.hyper-switch .track {
  position: absolute; inset: 0;
  background: var(--switch-off);
  border-radius: 14px;
  transition: background .25s cubic-bezier(.4,0,.2,1);
}
.hyper-switch input:checked + .track { background: var(--switch-on); }
.hyper-switch .thumb {
  position: absolute;
  width: 22px; height: 22px;
  top: 3px; left: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform .25s cubic-bezier(.4,0,.2,1), width .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.hyper-switch input:checked ~ .thumb { transform: translateX(22px); }
.hyper-switch:active .thumb { width: 26px; }
.hyper-switch input:checked ~ .thumb:active { transform: translateX(18px); }

/* ── Expandable Section ── */
.expand-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s cubic-bezier(.4,0,.2,1);
}
.expand-body.open { max-height: 2000px; }
.expand-inner { padding: 0 20px 16px; }
.expand-arrow {
  font-size: 12px;
  color: var(--text-tertiary);
  transition: transform .25s;
  margin-left: 4px;
}
.expand-arrow.open { transform: rotate(180deg); }

/* ── Mode Chips ── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip {
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  background: var(--input-bg);
  color: var(--text-secondary);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all .15s;
}
.chip.active {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: 500;
}

/* ── Input ── */
.field-label { font-size: 12px; color: var(--text-secondary); margin: 14px 0 6px; }
input[type=number], input[type=text], select {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--divider);
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
input:focus, select:focus { border-color: var(--primary); }
select { appearance: none; }
.input-row { display: flex; gap: 8px; }
.input-row input, .input-row select { flex: 1; }

/* ── Tags ── */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; min-height: 28px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px;
  border-radius: 14px;
  background: var(--tag-bg);
  font-size: 12px;
  color: var(--text-secondary);
}
.tag-x { cursor: pointer; font-size: 14px; opacity: .5; }

/* ── Button ── */
.btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--primary);
  color: #fff;
  transition: opacity .15s;
}
.btn:active { opacity: .7; }

/* ── Snackbar/Toast ── */
.snackbar {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--card);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  opacity: 0;
  transition: all .25s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
  z-index: 999;
}
.snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Power Grid ── */
.power-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 10px 0; }
.power-grid .chip { text-align: center; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>


<!-- TopAppBar -->
<div class="topbar">
  <h1>HyperThermal</h1>
  <div class="subtitle" id="deviceName">加载中...</div>
</div>

<!-- Status -->
<div class="status-row">
  <div class="status-item"><div class="val" id="sTemp">--</div><div class="lbl">温度°C</div></div>
  <div class="status-item"><div class="val" id="sPower">--</div><div class="lbl">功率W</div></div>
  <div class="status-item"><div class="val" id="sCapacity">--</div><div class="lbl">电量%</div></div>
  <div class="status-item"><div class="val" id="sMode">--</div><div class="lbl">模式</div></div>
</div>

<!-- 总开关 -->
<div class="small-title">控制</div>
<div class="card">
  <div class="pref" onclick="document.getElementById('enabled').click()">
    <div class="pref-icon">⚡</div>
    <div class="pref-body">
      <div class="pref-title">模块总开关</div>
      <div class="pref-desc" id="mainSub">运行中</div>
    </div>
    <div class="pref-right">
      <label class="hyper-switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="enabled" onchange="save()">
        <span class="track"></span><span class="thumb"></span>
      </label>
    </div>
  </div>
</div>

<!-- 充电场景 -->
<div class="small-title">场景</div>
<div class="card">
  <div class="pref" onclick="toggleExpand('charge')">
    <div class="pref-icon">🔋</div>
    <div class="pref-body">
      <div class="pref-title">充电场景</div>
      <div class="pref-desc" id="chargeSub">点击展开</div>
    </div>
    <div class="pref-right">
      <label class="hyper-switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="charge_mode" onchange="save();updateSubs()">
        <span class="track"></span><span class="thumb"></span>
      </label>
      <span class="expand-arrow" id="arrow-charge">▾</span>
    </div>
  </div>
  <div class="expand-body" id="expand-charge">
    <div class="expand-inner">
      <div class="field-label">亮屏充电档位</div>
      <div class="chips" id="chargeLevelChips"></div>
      <div class="field-label">息屏充电档位</div>
      <div class="chips" id="sleepLevelChips"></div>
      <div class="field-label">定时切换</div>
      <div class="input-row">
        <input type="number" id="time_start" placeholder="开始时" min="0" max="23" onchange="save()">
        <input type="number" id="time_end" placeholder="结束时" min="0" max="23" onchange="save()">
        <select id="time_level" onchange="save()">
          <option value="unlimited">无限制</option>
          <option value="level_1">一档</option><option value="level_2">二档</option>
          <option value="level_3">三档</option><option value="level_4">四档</option>
          <option value="level_5">五档</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 游戏场景 -->
<div class="card">
  <div class="pref" onclick="toggleExpand('game')">
    <div class="pref-icon">🎮</div>
    <div class="pref-body">
      <div class="pref-title">游戏场景</div>
      <div class="pref-desc" id="gameSub">点击展开</div>
    </div>
    <div class="pref-right">
      <label class="hyper-switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="game_mode" onchange="save();updateSubs()">
        <span class="track"></span><span class="thumb"></span>
      </label>
      <span class="expand-arrow" id="arrow-game">▾</span>
    </div>
  </div>
  <div class="expand-body" id="expand-game">
    <div class="expand-inner">
      <div class="field-label">游戏温控档位</div>
      <div class="chips" id="gameLevelChips"></div>
      <div class="pref" onclick="document.getElementById('game_bypass').click()" style="padding:12px 0;margin:0">
        <div class="pref-body"><div class="pref-title">游戏时旁路供电</div></div>
        <div class="pref-right"><label class="hyper-switch" onclick="event.stopPropagation()"><input type="checkbox" id="game_bypass" onchange="save()"><span class="track"></span><span class="thumb"></span></label></div>
      </div>
      <div class="field-label">锁定刷新率（0=关闭）</div>
      <input type="number" id="game_fps" min="0" placeholder="如 120" onchange="save()">
      <div class="field-label">游戏应用列表</div>
      <div class="tags" id="gameAppTags"></div>
      <div class="input-row" style="margin-top:8px">
        <input type="text" id="newApp" placeholder="包名">
        <button class="btn" onclick="addApp()">添加</button>
      </div>
    </div>
  </div>
</div>

<!-- 旁路供电 -->
<div class="small-title">旁路供电</div>
<div class="card">
  <div class="pref" onclick="toggleExpand('bypass')">
    <div class="pref-icon">🔌</div>
    <div class="pref-body">
      <div class="pref-title">旁路供电设置</div>
      <div class="pref-desc" id="bypassSub">点击展开</div>
    </div>
    <div class="pref-right"><span class="expand-arrow" id="arrow-bypass">▾</span></div>
  </div>
  <div class="expand-body" id="expand-bypass">
    <div class="expand-inner">
      <div class="pref" onclick="document.getElementById('bypass_manual').click()" style="padding:12px 0;margin:0">
        <div class="pref-body"><div class="pref-title">手动旁路</div><div class="pref-desc">立即生效</div></div>
        <div class="pref-right"><label class="hyper-switch" onclick="event.stopPropagation()"><input type="checkbox" id="bypass_manual" onchange="toggleBypass()"><span class="track"></span><span class="thumb"></span></label></div>
      </div>
      <div class="field-label">温度旁路 — 开启温度°C（0=关闭）</div>
      <input type="number" id="bypass_temp_on" min="0" max="60" onchange="save()">
      <div class="field-label">温度旁路 — 关闭温度°C</div>
      <input type="number" id="bypass_temp_off" min="0" max="60" onchange="save()">
      <div class="field-label">电量旁路 — 电量≥时开启（0=关闭）</div>
      <input type="number" id="bypass_level" min="0" max="100" onchange="save()">
    </div>
  </div>
</div>

<!-- 功率限制 -->
<div class="small-title">高级</div>
<div class="card">
  <div class="pref" onclick="toggleExpand('power')">
    <div class="pref-icon">⚙️</div>
    <div class="pref-body">
      <div class="pref-title">充电功率限制</div>
      <div class="pref-desc" id="powerSub">不限制</div>
    </div>
    <div class="pref-right"><span class="expand-arrow" id="arrow-power">▾</span></div>
  </div>
  <div class="expand-body" id="expand-power">
    <div class="expand-inner">
      <div class="field-label">最高充电功率</div>
      <div class="power-grid" id="powerGrid"></div>
      <div class="field-label" style="margin-top:16px">设备最大充电电流 μA</div>
      <input type="number" id="max_charge_current" placeholder="22000000" onchange="save()">
      <div class="field-label" style="margin-top:16px">普通场景温控</div>
      <div class="chips" id="defaultModeChips"></div>
    </div>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>


<script>
const MODDIR='/data/adb/modules/HyperThermal', CONF=MODDIR+'/config/settings.json';
let settings={}, gameApps=[];

const LEVELS=[{id:'unlimited',l:'无限制'},{id:'level_1',l:'一档'},{id:'level_2',l:'二档'},{id:'level_3',l:'三档'},{id:'level_4',l:'四档'},{id:'level_5',l:'五档'}];
const MODES=[{id:'default',l:'系统默认'},...LEVELS];
const POWERS=[{w:0,l:'不限',ua:22000000},{w:120,l:'120W',ua:22000000},{w:100,l:'100W',ua:18000000},{w:67,l:'67W',ua:12400000},{w:50,l:'50W',ua:9000000},{w:33,l:'33W',ua:6000000},{w:18,l:'18W',ua:3000000},{w:10,l:'10W',ua:1800000}];
const MODE_NAMES={default:'默认',unlimited:'无限制',level_1:'一档',level_2:'二档',level_3:'三档',level_4:'四档',level_5:'五档',bypass:'旁路',off:'关闭'};

function exec(cmd){return new Promise(r=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);window[cb]=(e,o,s)=>{delete window[cb];r({errno:e,stdout:o||'',stderr:s||''})};try{ksu.exec(cmd,'{}',cb)}catch(x){delete window[cb];r({errno:-1,stdout:'',stderr:String(x)})}});}
function toast(m){const s=document.getElementById('snackbar');s.textContent=m;s.classList.add('show');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('show'),2000);}

// ── Expand ──
function toggleExpand(id){
  const el=document.getElementById('expand-'+id);
  const ar=document.getElementById('arrow-'+id);
  el.classList.toggle('open');
  ar.classList.toggle('open');
}

// ── Chips ──
function renderChips(containerId, items, current, onSelect){
  document.getElementById(containerId).innerHTML=items.map(i=>`<div class="chip${current===i.id?' active':''}" onclick="${onSelect}('${i.id}')">${i.l}</div>`).join('');
}
function selectChargeLevel(id){settings.charge_level=id;renderChips('chargeLevelChips',LEVELS,id,'selectChargeLevel');save();}
function selectSleepLevel(id){settings.sleep_level=id;renderChips('sleepLevelChips',LEVELS,id,'selectSleepLevel');save();}
function selectGameLevel(id){settings.game_level=id;renderChips('gameLevelChips',LEVELS,id,'selectGameLevel');save();}
function selectDefaultMode(id){settings.default_mode=id;renderChips('defaultModeChips',MODES,id,'selectDefaultMode');save();}

// ── Power ──
function renderPowerGrid(){
  const cur=settings.power_limit_w||0;
  document.getElementById('powerGrid').innerHTML=POWERS.map(p=>`<div class="chip${cur===p.w?' active':''}" onclick="selectPower(${p.w})">${p.l}</div>`).join('');
}
function selectPower(w){settings.power_limit_w=w;renderPowerGrid();updatePowerSub();save();}
function updatePowerSub(){const w=settings.power_limit_w||0;document.getElementById('powerSub').textContent=w?`限制 ${w}W`:'不限制';}

// ── Game Apps ──
function renderGameApps(){
  const el=document.getElementById('gameAppTags');
  if(!gameApps.length){el.innerHTML='<span style="color:var(--text-tertiary);font-size:12px">未添加</span>';return;}
  el.innerHTML=gameApps.map((a,i)=>`<span class="tag">${a.split('.').pop()}<span class="tag-x" onclick="removeApp(${i})">✕</span></span>`).join('');
}
function addApp(){const input=document.getElementById('newApp'),p=input.value.trim();if(!p||!p.includes('.')){toast('请输入有效包名');return;}if(gameApps.includes(p)){toast('已存在');return;}gameApps.push(p);input.value='';renderGameApps();save();}
function removeApp(i){gameApps.splice(i,1);renderGameApps();save();}

// ── Bypass ──
async function toggleBypass(){const on=document.getElementById('bypass_manual').checked;await exec(`printf '%s' '${on?1:0}' > ${MODDIR}/config/bypass_manual`);toast(on?'旁路已开启':'旁路已关闭');}

// ── Subs ──
function updateSubs(){
  const cm=document.getElementById('charge_mode').checked,gm=document.getElementById('game_mode').checked;
  document.getElementById('chargeSub').textContent=cm?`亮屏:${MODE_NAMES[settings.charge_level]||'--'} 息屏:${MODE_NAMES[settings.sleep_level]||'--'}`:'已关闭';
  document.getElementById('gameSub').textContent=gm?`${MODE_NAMES[settings.game_level]||'--'}`:'已关闭';
  const bt=settings.bypass_temp_on,bl=settings.bypass_level,parts=[];
  if(bt>0)parts.push(`温度≥${bt}°C`);if(bl>0)parts.push(`电量≥${bl}%`);
  document.getElementById('bypassSub').textContent=parts.length?parts.join(' / '):'点击展开';
  updatePowerSub();
}

// ── Save ──
async function save(){
  settings.enabled=document.getElementById('enabled').checked;
  settings.charge_mode=document.getElementById('charge_mode').checked;
  settings.game_mode=document.getElementById('game_mode').checked;
  settings.game_bypass=document.getElementById('game_bypass').checked;
  settings.game_fps=parseInt(document.getElementById('game_fps').value)||0;
  settings.bypass_temp_on=parseInt(document.getElementById('bypass_temp_on').value)||0;
  settings.bypass_temp_off=parseInt(document.getElementById('bypass_temp_off').value)||0;
  settings.bypass_level=parseInt(document.getElementById('bypass_level').value)||0;
  settings.max_charge_current=parseInt(document.getElementById('max_charge_current').value)||22000000;
  settings.time_start=parseInt(document.getElementById('time_start').value)||0;
  settings.time_end=parseInt(document.getElementById('time_end').value)||0;
  settings.time_level=document.getElementById('time_level').value;
  settings.game_apps=gameApps.join('|');
  settings.current_limit=(POWERS.find(p=>p.w===settings.power_limit_w)||{ua:0}).ua||0;

  const lines=['{',
    `  "enabled": ${settings.enabled},`,`  "charge_mode": ${settings.charge_mode},`,
    `  "charge_level": "${settings.charge_level}",`,`  "sleep_level": "${settings.sleep_level}",`,
    `  "time_start": ${settings.time_start},`,`  "time_end": ${settings.time_end},`,
    `  "time_level": "${settings.time_level}",`,`  "game_mode": ${settings.game_mode},`,
    `  "game_level": "${settings.game_level}",`,`  "game_apps": "${settings.game_apps}",`,
    `  "game_fps": ${settings.game_fps},`,`  "game_bypass": ${settings.game_bypass},`,
    `  "bypass_temp_on": ${settings.bypass_temp_on},`,`  "bypass_temp_off": ${settings.bypass_temp_off},`,
    `  "bypass_level": ${settings.bypass_level},`,`  "default_mode": "${settings.default_mode}",`,
    `  "current_limit": ${settings.current_limit},`,`  "power_limit_w": ${settings.power_limit_w||0},`,
    `  "max_charge_current": ${settings.max_charge_current}`,'}'];
  const TMP=CONF+'.tmp';
  await exec(`printf '' > ${TMP}`);
  for(const line of lines){await exec(`printf '%s\\n' '${line.replace(/'/g,"'\\''")}'  >> ${TMP}`);}
  await exec(`mv ${TMP} ${CONF}`);
  updateSubs();
  toast('✓ 已保存');
}

// ── Load ──
async function load(){
  const r=await exec(`cat ${CONF} 2>/dev/null`);
  if(r.stdout.trim())try{settings=JSON.parse(r.stdout.trim())}catch(e){settings={}}
  document.getElementById('enabled').checked=settings.enabled!==false;
  document.getElementById('charge_mode').checked=settings.charge_mode!==false;
  document.getElementById('game_mode').checked=settings.game_mode!==false;
  document.getElementById('game_bypass').checked=settings.game_bypass===true;
  document.getElementById('game_fps').value=settings.game_fps||0;
  document.getElementById('bypass_temp_on').value=settings.bypass_temp_on||0;
  document.getElementById('bypass_temp_off').value=settings.bypass_temp_off||0;
  document.getElementById('bypass_level').value=settings.bypass_level||0;
  document.getElementById('max_charge_current').value=settings.max_charge_current||22000000;
  document.getElementById('time_start').value=settings.time_start||0;
  document.getElementById('time_end').value=settings.time_end||0;
  document.getElementById('time_level').value=settings.time_level||'level_1';
  gameApps=(settings.game_apps||'').split('|').filter(Boolean);
  renderGameApps();
  renderChips('chargeLevelChips',LEVELS,settings.charge_level||'unlimited','selectChargeLevel');
  renderChips('sleepLevelChips',LEVELS,settings.sleep_level||'level_1','selectSleepLevel');
  renderChips('gameLevelChips',LEVELS,settings.game_level||'unlimited','selectGameLevel');
  renderChips('defaultModeChips',MODES,settings.default_mode||'default','selectDefaultMode');
  renderPowerGrid();
  const bp=await exec(`cat ${MODDIR}/config/bypass_manual 2>/dev/null`);
  document.getElementById('bypass_manual').checked=bp.stdout.trim()==='1';
  const rt=await exec(`cat ${MODDIR}/config/runtime.json 2>/dev/null`);
  if(rt.stdout.trim())try{const i=JSON.parse(rt.stdout.trim());document.getElementById('deviceName').textContent=`${i.market_name||i.model} · HyperOS ${i.os_version}`}catch(e){}
  updateSubs();
}

// ── Refresh ──
async function refreshStatus(){
  const r=await exec(`cat ${MODDIR}/config/status.json 2>/dev/null`);
  if(!r.stdout.trim())return;
  let s;try{s=JSON.parse(r.stdout.trim())}catch(e){return}
  const tc=s.temp/10;
  const tempEl=document.getElementById('sTemp');
  tempEl.textContent=tc.toFixed(1);
  tempEl.style.color=tc>=45?'var(--danger)':tc>=40?'var(--warn)':'var(--success)';
  let pw='--';
  if(s.voltage>0&&s.current<0)pw=((s.voltage/1e6)*(Math.abs(s.current)/1e6)).toFixed(1);
  else if(s.status==='Full')pw='满';
  document.getElementById('sPower').textContent=pw;
  document.getElementById('sCapacity').textContent=s.capacity;
  document.getElementById('sMode').textContent=MODE_NAMES[s.mode]||s.mode||'--';
  document.getElementById('mainSub').textContent=s.status==='Charging'?'充电中':s.status==='Full'?'已充满':'放电中';
}

load();refreshStatus();setInterval(refreshStatus,3000);
</script>
